<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Ali Hassan 🎂</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #d9c7ff);
      overflow: hidden;
      color: #4a2140;
    }
    .card {
      width: min(90%, 520px);
      padding: 35px 25px;
      text-align: center;
      background: rgba(255,255,255,.9);
      border-radius: 25px;
      box-shadow: 0 12px 35px rgba(0,0,0,.15);
      position: relative;
      z-index: 2;
    }
    h1 { font-size: 38px; margin: 10px 0; }
    h2 { font-size: 28px; margin: 12px 0 18px; }
    p { font-size: 18px; line-height: 1.6; }
    .cake { font-size: 70px; }
    .heart { font-size: 30px; margin-top: 15px; }
    .confetti {
      position: fixed;
      top: -20px;
      font-size: 24px;
      animation: fall 7s linear infinite;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="confetti" style="left:8%;animation-delay:0s">🎈</div>
  <div class="confetti" style="left:25%;animation-delay:2s">✨</div>
  <div class="confetti" style="left:45%;animation-delay:1s">🎉</div>
  <div class="confetti" style="left:65%;animation-delay:3s">💖</div>
  <div class="confetti" style="left:85%;animation-delay:1.5s">🎈</div>

  <div class="card">
    <div class="cake">🎂</div>
    <h1>Happy Birthday!</h1>
    <h2>Ali Hassan 💖</h2>
    <p>
      May your special day be filled with happiness, love, laughter
      and beautiful memories. May Allah bless you with endless
      happiness, success and a long, peaceful life. 🤲✨
    </p>
    <p><strong>Have a wonderful birthday! 🎉🎁</strong></p>
    <div class="heart">❤️ 🥳 ❤️</div>
  </div>
</body>
</html>
